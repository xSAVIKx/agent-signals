# Opens and updates the release pull request from the Conventional Commits on
# main. A merge of that pull request makes the tag and the GitHub release.
# GitHub marks the newest release as "Latest". The three packages release
# at the same time, so the last step marks the newest corpus release as
# "Latest" after each release.
#
# Each action is pinned to a commit SHA. The comment gives the tag.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out the release commit
        if: steps.release.outputs.release_created == 'true' || steps.release.outputs['go--release_created'] == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach the probe kit to the corpus release
        # The one-line kit (probes/kit.sh, probes/kit.ps1) downloads these
        # files from the latest release.
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version=${TAG#corpus-v}
          sh tools/kit-archive.sh tar.gz agent-signals-kit.tar.gz "$version"
          sh tools/kit-archive.sh zip agent-signals-kit.zip "$version"
          sha256sum agent-signals-kit.tar.gz agent-signals-kit.zip >agent-signals-kit.sha256
          cat agent-signals-kit.sha256
          gh release upload "$TAG" agent-signals-kit.tar.gz agent-signals-kit.zip agent-signals-kit.sha256 --clobber
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.release.outputs['go--release_created'] == 'true'
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Attach the fake model binaries to the Go release
        # agent-signals-fake-model for each OS and CPU, with no cgo, and
        # SHA256SUMS. Read go/fakemodel for the supported client versions.
        if: steps.release.outputs['go--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs['go--tag_name'] }}
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}
            arch=${t#*/}
            ext=
            [ "$os" != windows ] || ext=.exe
            (cd go && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags=-s \
              -o "../dist/agent-signals-fake-model-$os-$arch$ext" ./cmd/agent-signals-fake-model)
          done
          (cd dist && sha256sum agent-signals-fake-model-* >SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber
      - name: Mark the newest corpus release as Latest
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --limit 50 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("corpus-v"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            echo "no corpus release"
            exit 0
          fi
          gh release edit "$tag" --latest
          echo "latest: $tag"
