# Opens and updates the release pull request from the Conventional Commits on
# main. A merge of that pull request makes the tag and the GitHub release.
# GitHub marks the newest release as "Latest". The three packages release
# at the same time, so the last step marks the newest corpus release as
# "Latest" after each release.
#
# The job corpus-assets attaches the probe kit, the corpus archives,
# SHA256SUMS and a build provenance attestation to each corpus release.
#
# Each action is pinned to a commit SHA. The comment gives the tag.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Check out the release commit
        if: steps.release.outputs['go--release_created'] == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.release.outputs['go--release_created'] == 'true'
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Attach the fake model binaries to the Go release
        # agent-signals-fake-model for each OS and CPU, with no cgo, and
        # SHA256SUMS. Read go/fakemodel for the supported client versions.
        if: steps.release.outputs['go--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs['go--tag_name'] }}
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}
            arch=${t#*/}
            ext=
            [ "$os" != windows ] || ext=.exe
            (cd go && CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags=-s \
              -o "../dist/agent-signals-fake-model-$os-$arch$ext" ./cmd/agent-signals-fake-model)
          done
          (cd dist && sha256sum agent-signals-fake-model-* >SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber
      - name: Mark the newest corpus release as Latest
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --limit 50 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("corpus-v"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            echo "no corpus release"
            exit 0
          fi
          gh release edit "$tag" --latest
          echo "latest: $tag"

  corpus-assets:
    name: Corpus release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          # The cache restore can hang at the egress limit of the account.
          cache: false
      - name: Build the probe kit and the corpus archives
        # The one-line kit (probes/kit.sh, probes/kit.ps1) downloads the kit
        # files from the latest release. The site builder makes corpus.json
        # and facts.json, with the command of the Pages workflow.
        # release-corpus.sh writes SHA256SUMS over each file in dist/.
        run: |
          version=${TAG#corpus-v}
          mkdir dist
          sh tools/kit-archive.sh tar.gz dist/agent-signals-kit.tar.gz "$version"
          sh tools/kit-archive.sh zip dist/agent-signals-kit.zip "$version"
          (cd dist && sha256sum agent-signals-kit.tar.gz agent-signals-kit.zip >agent-signals-kit.sha256)
          (cd tools && go run ./cmd/site -root .. -out "$RUNNER_TEMP/site")
          sh tools/release-corpus.sh "$version" dist "$RUNNER_TEMP/site"
          cat dist/SHA256SUMS
      - name: Attach the files to the corpus release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber
      # The attestation step comes after the upload, so that a failure of
      # the attestation does not stop the kit download.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
