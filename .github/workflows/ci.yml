# Checks each pull request and each push to main: the format and the tests of
# the tools, the validation of the whole corpus, the Go library and the Python
# library.
#
# All jobs run on GitHub-hosted runners. Each action is pinned to a commit
# SHA. The comment gives the tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          # The cache restore can hang at the egress limit of the account.
          cache: false
      - name: Format
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -count=1 ./...
      - name: Validate the corpus
        run: go run ./cmd/validate ..
      # The pages workflow deploys the site from main. This step makes a
      # broken generator fail the pull request first.
      - name: Build the site
        run: go run ./cmd/site -root .. -out ../_site

  go-library:
    name: Go library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Format
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Tests (this includes the check of go/data)
        run: go test -count=1 ./...

  python-library:
    name: Python library (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The lowest and the highest supported Python version.
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e "python[test]"
      - name: Tests (this includes the check of the data copy)
        run: python -m pytest -p no:cacheprovider python

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning
      - name: Scrub test
        run: sh tools/test-scrub.sh
      # The tests of the Windows terminal driver that run on Linux: the
      # pyte screen and its format, compared with tmux capture-pane.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Driver test
        run: |
          command -v tmux >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q tmux; }
          uv run --no-project --python 3.12 --with pyte==0.8.2 --with wcwidth==0.9.4 \
            python -m unittest discover -s scenarios/tests -v
