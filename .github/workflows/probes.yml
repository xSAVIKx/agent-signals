# Runs each probe and the kit on GitHub-hosted runners: each free image of
# Linux (x64 and arm64), macOS (arm64 and x64) and Windows (x64 and arm64).
# No agent is installed and no secret is used, so each probe must run to
# the end and print all its sections. The scrubbed output goes to the log,
# which is public.
#
# ubuntu-slim is a container with 1 vCPU. It can lack tools that the other
# images have, so a failure there does not fail the workflow.
#
# Each action is pinned to a commit SHA. The comment gives the tag.
name: Probes

on:
  pull_request:
    paths:
      - "probes/**"
      - "tools/scrub*"
      - "tools/test-scrub*"
      - "tools/testdata/scrub/**"
      - "tools/check-probe-output.sh"
      - ".github/workflows/probes.yml"
  push:
    branches: [main]
    paths:
      - "probes/**"
      - "tools/scrub*"
      - ".github/workflows/probes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: Unix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - ubuntu-slim
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-slim' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scrub test
        run: sh tools/test-scrub.sh
      - name: Probes
        run: |
          fail=0
          for p in probes/*/unix.sh; do
            sh "$p" >out.txt 2>&1 || { echo "exit $? from $p"; fail=1; }
            sh tools/check-probe-output.sh "$p" out.txt || fail=1
          done
          exit "$fail"
      - name: Terminal probe
        if: runner.os == 'macOS'
        run: |
          sh probes/terminals/macos.sh >out.txt 2>&1
          sh tools/check-probe-output.sh probes/terminals/macos.sh out.txt
      - name: Image
        run: |
          uname -srm
          if [ -r /etc/os-release ]; then . /etc/os-release && echo "$PRETTY_NAME"; fi
          if command -v sw_vers >/dev/null; then sw_vers; fi
          for t in ps pgrep lsof tmux sudo python3; do
            printf '%s: %s\n' "$t" "$(command -v "$t" || echo missing)"
          done
      - name: Kit
        run: |
          sh probes/run.sh --all </dev/null
          f=$(ls agent-signals-probe-*.txt)
          grep -c '^### ' "$f"
          cat "$f"
          rm -f agent-signals-probe-*.txt
      - name: Kit through the one-liner
        # The one-liner reads a local archive here, so the step needs no
        # network.
        run: |
          git archive --format=tar.gz --prefix=agent-signals-kit/ -o "$RUNNER_TEMP/kit.tar.gz" HEAD probes tools/scrub.sh tools/scrub.ps1
          AGENT_SIGNALS_URL="file://$RUNNER_TEMP/kit.tar.gz" sh -c 'cat probes/kit.sh | sh -s -- --all'
          f=$(ls agent-signals-probe-*.txt)
          grep -c '^### ' "$f"

  windows:
    name: Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scrub test (PowerShell 7)
        shell: pwsh
        run: ./tools/test-scrub.ps1
      - name: Scrub test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/test-scrub.ps1
      - name: Probes
        shell: bash
        run: |
          fail=0
          for p in probes/*/windows.ps1; do
            pwsh -NoProfile -File "$p" >out.txt 2>&1 || { echo "exit $? from $p"; fail=1; }
            sh tools/check-probe-output.sh "$p" out.txt || fail=1
          done
          exit "$fail"
      - name: Probes (Windows PowerShell 5.1)
        shell: bash
        run: |
          fail=0
          for p in probes/*/windows.ps1; do
            powershell -NoProfile -ExecutionPolicy Bypass -File "$p" >out.txt 2>&1 || { echo "exit $? from $p"; fail=1; }
            sh tools/check-probe-output.sh "$p" out.txt || fail=1
          done
          exit "$fail"
      - name: Kit
        shell: pwsh
        run: |
          ./probes/run.ps1 -All
          $f = Get-ChildItem agent-signals-probe-windows-*.txt | Select-Object -First 1
          Get-Content $f
          Remove-Item agent-signals-probe-windows-*.txt
      - name: Kit through the one-liner (PowerShell 7 and 5.1)
        # The one-liner reads a local archive here, so the step needs no
        # network.
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'kit.zip'
          git archive --format=zip --prefix=agent-signals-kit/ -o $zip HEAD probes tools/scrub.sh tools/scrub.ps1
          $env:AGENT_SIGNALS_URL = $zip
          foreach ($exe in 'pwsh', 'powershell') {
            & $exe -NoProfile -Command "& ([scriptblock]::Create((Get-Content -Raw probes/kit.ps1))) -All"
            if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE from $exe" }
            $f = @(Get-ChildItem agent-signals-probe-windows-*.txt)
            if ($f.Count -ne 1) { throw "$exe wrote $($f.Count) files" }
            Write-Host "$exe sections: $(@(Select-String -Path $f[0] -Pattern '^### ').Count)"
            Remove-Item $f
          }
          # The form of the README: the script text through iex, with no argument.
          pwsh -NoProfile -Command "Get-Content -Raw probes/kit.ps1 | Invoke-Expression"
          if ($LASTEXITCODE -ne 0) { throw "exit $LASTEXITCODE from iex" }
          $f = @(Get-ChildItem agent-signals-probe-windows-*.txt)
          if ($f.Count -ne 1) { throw "iex wrote $($f.Count) files" }
          Remove-Item $f
