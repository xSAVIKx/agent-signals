# Runs the no-login scenarios on each free GitHub-hosted runner image for
# Linux and macOS, and an install report on each free Windows image.
#
# The first-run job installs each agent, starts it once with no login, and
# prints a scrubbed summary: the first screen, the processes, and the
# folders that the agent made. The agents are in four groups, so that one
# job stays below 30 minutes.
#
# The windows-installs job installs the agents and records where each
# install keeps its version and what its folder holds. It starts no agent.
#
# The first-run-windows job installs the same agents, starts each one once
# with no login in a pseudo console (scenarios/conpty.py), and prints a
# scrubbed summary, as the first-run job does on Linux and macOS.
#
# The jobs use no secret and make no model turn. The workflow runs only when
# started by hand and once a week, because it installs software from the
# network. A start by hand can select one job with the input "job".
#
# Each action is pinned to a commit SHA. The comment gives the tag.
name: Scenarios

on:
  workflow_dispatch:
    inputs:
      job:
        description: The job to run
        type: choice
        default: all
        options: [all, first-run, windows-installs, first-run-windows]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  first-run:
    name: First run (${{ matrix.os }}, group ${{ matrix.group }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'first-run'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
        group: [a, b, c, d]
        # Each entry is AGENT:COMMAND for scenarios/first-run.sh.
        # codex-home is Codex CLI with CODEX_HOME in the throwaway folder.
        include:
          - group: a
            agents: >-
              claude:claude codex:codex codex-home:codex cursor:cursor-agent
              opencode:opencode gemini:gemini copilot:copilot qwen:qwen
              aider:aider
          - group: b
            agents: >-
              amp:amp goose:goose crush:crush kimi:kimi continue:cn
              droid:droid cline:cline kilo:kilo auggie:auggie
              openhands:openhands opencode2:opencode2
          - group: c
            agents: >-
              kiro:kiro-cli junie:junie codebuff:codebuff qoder:qodercli
              codebuddy:codebuddy letta:letta neovate:neovate
          - group: d
            agents: >-
              everycode:coder iflow:iflow vibe:vibe gptme:gptme
              interpreter:interpreter grok:grok
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Node.js on each image. Claude Code and Qwen Code need 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv installs the Python agents with their own Python 3.12.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux
          else
            sudo apt-get update -q && sudo apt-get install -y -q tmux
          fi
      - name: Add the user folders to PATH
        run: |
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          echo "$HOME/.kimi-code/bin" >>"$GITHUB_PATH"
          echo "$HOME/.grok/bin" >>"$GITHUB_PATH"
          echo "/Applications/Kiro CLI.app/Contents/MacOS" >>"$GITHUB_PATH"
      # The install commands come from the npm registry, PyPI, or the
      # vendor's install page. A failed install skips that agent.
      - name: Install Claude Code
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Codex CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @openai/codex
      - name: Install opencode
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g opencode-ai
      - name: Install Cursor CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: curl -fsS https://cursor.com/install | bash
      - name: Install Gemini CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @google/gemini-cli
      - name: Install GitHub Copilot CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @github/copilot
      - name: Install Qwen Code
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @qwen-code/qwen-code
      # pipx uses the Python of the image. When it fails (as on macOS with
      # a new Python), uv tries again with Python 3.12.
      - name: Install Aider
        if: matrix.group == 'a'
        continue-on-error: true
        run: pipx install aider-chat || uv tool install --python 3.12 aider-chat
      - name: Install Amp
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @ampcode/cli
      - name: Install Goose
        if: matrix.group == 'b'
        continue-on-error: true
        run: curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
      - name: Install Crush
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @charmland/crush
      - name: Install Kimi Code CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: curl -fsSL https://code.kimi.com/kimi-code/install.sh | KIMI_NO_MODIFY_PATH=1 bash
      - name: Install Continue CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @continuedev/cli
      - name: Install Factory Droid
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @factory/cli
      - name: Install Cline CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g cline
      - name: Install Kilo Code CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @kilocode/cli
      - name: Install Auggie
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @augmentcode/auggie
      - name: Install OpenHands CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: uv tool install --python 3.12 openhands
      # opencode 2: the npm package of the anomalyco/opencode README. It has
      # the commands opencode and opencode2. Group b does not install the
      # opencode 1 package, so the commands do not collide.
      - name: Install opencode 2
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @opencode/cli
      # The Kiro CLI installer of https://kiro.dev/docs/cli/. It puts
      # kiro-cli in ~/.local/bin on Linux and an app in /Applications on
      # macOS.
      - name: Install Kiro CLI
        if: matrix.group == 'c'
        continue-on-error: true
        run: curl -fsSL https://cli.kiro.dev/install | bash
      # The Junie installer of the JetBrains/junie README. It puts the
      # shim in ~/.local/bin and the binary in ~/.local/share/junie.
      - name: Install Junie CLI
        if: matrix.group == 'c'
        continue-on-error: true
        run: curl -fsSL https://junie.jetbrains.com/install.sh | bash
      - name: Install Codebuff
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g codebuff
      - name: Install Qoder CLI
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @qoder-ai/qodercli
      - name: Install CodeBuddy Code
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @tencent-ai/codebuddy-code
      - name: Install Letta Code
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @letta-ai/letta-code
      - name: Install Neovate Code
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @neovate/code
      - name: Install Every Code
        if: matrix.group == 'd'
        continue-on-error: true
        run: npm install -g @just-every/code
      - name: Install iFlow CLI
        if: matrix.group == 'd'
        continue-on-error: true
        run: npm install -g @iflow-ai/iflow-cli
      - name: Install Mistral Vibe
        if: matrix.group == 'd'
        continue-on-error: true
        run: uv tool install --python 3.12 mistral-vibe
      - name: Install gptme
        if: matrix.group == 'd'
        continue-on-error: true
        run: uv tool install --python 3.12 gptme
      # The installer of the Rust Open Interpreter (its README). It puts
      # interpreter in ~/.local/bin.
      - name: Install Open Interpreter
        if: matrix.group == 'd'
        continue-on-error: true
        run: curl -fsSL https://www.openinterpreter.com/install | sh
      # The installer of the superagent-ai/grok-cli README. It puts grok in
      # ~/.grok/bin.
      - name: Install Grok CLI
        if: matrix.group == 'd'
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/superagent-ai/grok-cli/main/install.sh | bash
      # The raw output of each run goes to a file, not to the public log.
      # The summary prints it through the scrub.
      - name: Run the scenarios
        env:
          AGENTS: ${{ matrix.agents }}
        run: |
          mkdir -p out
          for pair in $AGENTS; do
            a=${pair%%:*}
            c=${pair##*:}
            if sh scenarios/first-run.sh "$a" "$c" >"out/run-$a.txt" 2>&1; then
              echo "ran: $a"
            else
              echo "skipped or failed: $a"
            fi
          done
      - name: Summary (scrubbed)
        if: always()
        run: |
          for f in out/run-*.txt; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f" .txt)"
            sh tools/scrub.sh "$f" 2>/dev/null | grep -v '^output: ' | tail -n 3
          done
          for o in out/first-run-*; do
            [ -d "$o" ] || continue
            echo "################ $(basename "$o" | sed 's/-[0-9T]*Z$//')"
            sh tools/scrub.sh "$o/log.txt" 2>/dev/null
            echo "--- screen after 20 s"
            grep -v '^[[:space:]]*$' "$o/02-after-20s.screen" | sh tools/scrub.sh 2>/dev/null | head -n 30
            echo "--- processes"
            sh tools/scrub.sh "$o/02-after-20s.ps" 2>/dev/null
            echo "--- top folders made in the throwaway HOME"
            awk '{print $3}' "$o/02-after-20s.files" | sed 's#<sandbox>/home/##' | cut -d/ -f1-2 | sort | uniq -c | sort -rn | head -n 15
            # Also the folders of the folder variables (codex-home), which
            # start with <sandbox>/. next to the throwaway HOME.
            echo "--- open files below the throwaway HOME"
            grep -E '<sandbox>/(home|\.)' "$o/02-after-20s.open" | awk '{print $2}' | sed 's#<sandbox>/home/##' | sh tools/scrub.sh 2>/dev/null | sort -u | head -n 30
            echo "--- folders made in the throwaway HOME (files in each)"
            awk '{print $3}' "$o/02-after-20s.files" | sed 's#<sandbox>/home/##' | cut -d/ -f1-3 | sh tools/scrub.sh 2>/dev/null | sort | uniq -c | head -n 40
          done
      # The artifact holds only scrubbed copies: the screen after 20 s and
      # the log of each agent. The raw files stay on the runner, because
      # the artifacts of a public repository are public.
      - name: Scrub the screens for the artifact
        if: always()
        run: |
          mkdir -p scrubbed
          for o in out/first-run-*; do
            [ -d "$o" ] || continue
            d=scrubbed/$(basename "$o" | sed 's/-[0-9T]*Z$//')
            mkdir -p "$d"
            [ -f "$o/02-after-20s.screen" ] && sh tools/scrub.sh "$o/02-after-20s.screen" >"$d/02-after-20s.screen" 2>/dev/null
            [ -f "$o/log.txt" ] && sh tools/scrub.sh "$o/log.txt" >"$d/log.txt" 2>/dev/null
          done
          true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: first-run-${{ matrix.os }}-${{ matrix.group }}
          path: scrubbed/
          retention-days: 7
          if-no-files-found: warn

  windows-installs:
    name: Windows installs (${{ matrix.os }}, group ${{ matrix.group }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'windows-installs'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        group: [a, b, c, d]
        # Each entry is NAME=COMMAND[=NPM PACKAGE] for
        # scenarios/windows-installs.ps1.
        include:
          - group: a
            agents: >-
              claude=claude=@anthropic-ai/claude-code codex=codex=@openai/codex
              opencode=opencode=opencode-ai gemini=gemini=@google/gemini-cli
              copilot=copilot=@github/copilot qwen=qwen=@qwen-code/qwen-code
              cursor=agent cursor-agent=cursor-agent
          - group: b
            agents: >-
              amp=amp=@ampcode/cli crush=crush=@charmland/crush
              continue=cn=@continuedev/cli droid=droid=@factory/cli
              cline=cline=cline kilo=kilo=@kilocode/cli
              auggie=auggie=@augmentcode/auggie kimi=kimi
              opencode2=opencode2=@opencode/cli
          - group: c
            agents: >-
              kiro=kiro-cli junie=junie
              codebuff=codebuff=codebuff qoder=qodercli=@qoder-ai/qodercli
              codebuddy=codebuddy=@tencent-ai/codebuddy-code
              letta=letta=@letta-ai/letta-code neovate=neovate=@neovate/code
              everycode=coder=@just-every/code iflow=iflow=@iflow-ai/iflow-cli
          - group: d
            agents: >-
              aider=aider openhands=openhands gptme=gptme vibe=vibe
              goose=goose interpreter=interpreter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv installs the Python agents of group d.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # A failed install skips that agent.
      - name: Install the agents
        shell: pwsh
        run: ./scenarios/install-windows-agents.ps1 -Group ${{ matrix.group }}
      - name: Install report (scrubbed)
        shell: pwsh
        env:
          AGENTS: ${{ matrix.agents }}
        run: |
          $list = @($env:AGENTS -split '\s+' | Where-Object { $_ })
          ./scenarios/windows-installs.ps1 @list
      - name: Kit (scrubbed)
        if: always()
        shell: pwsh
        run: |
          ./probes/run.ps1 -All
          $f = Get-ChildItem agent-signals-probe-windows-*.txt | Select-Object -First 1
          Get-Content $f

  first-run-windows:
    name: First run Windows (${{ matrix.os }}, group ${{ matrix.group }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'first-run-windows'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        group: [a, b, c, d]
        # Each entry is NAME=COMMAND for scenarios/first-run-windows.ps1.
        # codex-home runs before codex, so that the real profile has no
        # .codex folder from the codex run yet.
        include:
          - group: a
            agents: >-
              claude=claude codex-home=codex codex=codex opencode=opencode
              gemini=gemini copilot=copilot qwen=qwen cursor=cursor-agent
          - group: b
            agents: >-
              amp=amp crush=crush continue=cn droid=droid cline=cline
              kilo=kilo auggie=auggie kimi=kimi opencode2=opencode2
          - group: c
            agents: >-
              kiro=kiro-cli junie=junie codebuff=codebuff qoder=qodercli
              codebuddy=codebuddy letta=letta neovate=neovate
              everycode=coder iflow=iflow
          - group: d
            agents: >-
              aider=aider openhands=openhands gptme=gptme vibe=vibe
              goose=goose interpreter=interpreter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv installs its own Python 3.12 for the CPU of the image, also on
      # arm64.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The driver packages, at exact versions.
      - name: Install the driver packages
        shell: pwsh
        run: |
          uv venv --managed-python --python 3.12 .venv-driver
          uv pip install --python .venv-driver pywinpty==3.1.2 pyte==0.8.2 wcwidth==0.9.4 psutil==7.2.2
      # A failed install skips that agent.
      - name: Install the agents
        shell: pwsh
        run: ./scenarios/install-windows-agents.ps1 -Group ${{ matrix.group }}
      # The raw output of each run goes to files in out\, not to the public
      # log. The next step prints it through the scrub.
      - name: Run the scenarios
        shell: pwsh
        env:
          AGENTS: ${{ matrix.agents }}
        run: |
          $list = @($env:AGENTS -split '\s+' | Where-Object { $_ })
          ./scenarios/first-run-windows.ps1 -Python .venv-driver\Scripts\python.exe @list
      - name: Summary (scrubbed)
        if: always()
        shell: pwsh
        run: ./scenarios/first-run-windows.ps1 -Summary
