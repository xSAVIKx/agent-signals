# Runs the no-login scenarios on each free GitHub-hosted runner image for
# Linux and macOS, and an install report on each free Windows image.
#
# The first-run job installs each agent, starts it once with no login, and
# prints a scrubbed summary: the first screen, the processes, and the
# folders that the agent made. The agents are in four groups, so that one
# job stays below 30 minutes.
#
# The windows-installs job installs the agents and records where each
# install keeps its version and what its folder holds. It starts no agent.
#
# The first-run-windows job installs the same agents, starts each one once
# with no login in a pseudo console (scenarios/conpty.py), and prints a
# scrubbed summary, as the first-run job does on Linux and macOS.
#
# The kit jobs run the agent kit (probes/agent) against real agents. Read
# docs/design/2026-11-01-agent-run-kit.md.
#
# kit-no-login and kit-no-login-windows use no secret. They install the
# agents of the kit, run "kit start --home throwaway", "kit doctor", each
# first-run-* step that "kit plan" lists, and "kit check". Then they run the
# login steps of Codex, Claude Code and agy in a second run with "--home
# fixture": a local fake model (probes/agent/fake-model.py) answers, with no
# login and no cost.
#
# kit-login (Linux and macOS) and kit-login-windows use the API keys of
# docs/ci-secrets.md. They run only on the main branch: on the schedule, or
# by hand with the input "job" set to kit-login (not with "all"). Each job
# installs only the agents that have a key. Then, one agent at a time,
# scenarios/kit-login.sh or kit-login.ps1 writes the key of that agent,
# runs the first permission-* step of that agent in the plan (one model
# turn, the "cost" column of steps.tsv), and deletes the key. The step gets
# only the key of that agent. The "kit check" step gets all keys, so that
# it can find a key in the run files, and it starts no agent. The runner is
# a new machine for each job, so the job uses "--home real": the kit skips
# each step that needs a login with "--home throwaway". The login jobs
# upload the archive only when the input "upload_login" is on.
#
# The kit jobs run the steps that "kit plan" lists. A step kind with no
# script yet is not in the plan, so the jobs work before and after the
# scripts come. The raw output of each kit command goes to a file. The log
# gets it only through tools/scrub.sh or tools/scrub.ps1. Each kit job
# uploads the archive of "kit check" (it holds only checked, scrubbed
# files) and prints the file names in it, not their content. A kit job
# fails when "kit check" fails. After the check, it also fails when a step
# failed, or when an agent with a key has no step.
#
# Only kit-login and kit-login-windows use a secret and make model turns.
# The workflow runs only when started by hand and once a week, because it
# installs software from the network. A start by hand can select one job
# with the input "job".
#
# Each action is pinned to a commit SHA. The comment gives the tag.
name: Scenarios

on:
  workflow_dispatch:
    inputs:
      job:
        description: The job to run
        type: choice
        default: all
        options: [all, first-run, windows-installs, first-run-windows, kit-no-login, kit-login]
      upload_login:
        description: Upload the archives of the login jobs. Keep it off until the operator read one archive.
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  first-run:
    name: First run (${{ matrix.os }}, group ${{ matrix.group }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'first-run'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
        group: [a, b, c, d]
        # Each entry is AGENT:COMMAND for scenarios/first-run.sh.
        # codex-home is Codex CLI with CODEX_HOME in the throwaway folder.
        include:
          - group: a
            agents: >-
              claude:claude codex:codex codex-home:codex cursor:cursor-agent
              opencode:opencode gemini:gemini copilot:copilot qwen:qwen
              aider:aider
          - group: b
            agents: >-
              amp:amp goose:goose crush:crush kimi:kimi continue:cn
              droid:droid cline:cline kilo:kilo auggie:auggie
              openhands:openhands opencode2:opencode2
          - group: c
            agents: >-
              kiro:kiro-cli junie:junie codebuff:codebuff qoder:qodercli
              codebuddy:codebuddy letta:letta neovate:neovate
          - group: d
            agents: >-
              everycode:coder iflow:iflow vibe:vibe gptme:gptme
              interpreter:interpreter grok:grok
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same Node.js on each image. Claude Code and Qwen Code need 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv installs the Python agents with their own Python 3.12.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux
          else
            sudo apt-get update -q && sudo apt-get install -y -q tmux
          fi
      - name: Add the user folders to PATH
        run: |
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          echo "$HOME/.kimi-code/bin" >>"$GITHUB_PATH"
          echo "$HOME/.grok/bin" >>"$GITHUB_PATH"
          echo "/Applications/Kiro CLI.app/Contents/MacOS" >>"$GITHUB_PATH"
      # The install commands come from the npm registry, PyPI, or the
      # vendor's install page. A failed install skips that agent.
      - name: Install Claude Code
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Codex CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @openai/codex
      - name: Install opencode
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g opencode-ai
      - name: Install Cursor CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: curl -fsS https://cursor.com/install | bash
      - name: Install Gemini CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @google/gemini-cli
      - name: Install GitHub Copilot CLI
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @github/copilot
      - name: Install Qwen Code
        if: matrix.group == 'a'
        continue-on-error: true
        run: npm install -g @qwen-code/qwen-code
      # pipx uses the Python of the image. When it fails (as on macOS with
      # a new Python), uv tries again with Python 3.12.
      - name: Install Aider
        if: matrix.group == 'a'
        continue-on-error: true
        run: pipx install aider-chat || uv tool install --python 3.12 aider-chat
      - name: Install Amp
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @ampcode/cli
      - name: Install Goose
        if: matrix.group == 'b'
        continue-on-error: true
        run: curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash
      - name: Install Crush
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @charmland/crush
      - name: Install Kimi Code CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: curl -fsSL https://code.kimi.com/kimi-code/install.sh | KIMI_NO_MODIFY_PATH=1 bash
      - name: Install Continue CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @continuedev/cli
      - name: Install Factory Droid
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @factory/cli
      - name: Install Cline CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g cline
      - name: Install Kilo Code CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @kilocode/cli
      - name: Install Auggie
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @augmentcode/auggie
      - name: Install OpenHands CLI
        if: matrix.group == 'b'
        continue-on-error: true
        run: uv tool install --python 3.12 openhands
      # opencode 2: the npm package of the anomalyco/opencode README. It has
      # the commands opencode and opencode2. Group b does not install the
      # opencode 1 package, so the commands do not collide.
      - name: Install opencode 2
        if: matrix.group == 'b'
        continue-on-error: true
        run: npm install -g @opencode/cli
      # The Kiro CLI installer of https://kiro.dev/docs/cli/. It puts
      # kiro-cli in ~/.local/bin on Linux and an app in /Applications on
      # macOS.
      - name: Install Kiro CLI
        if: matrix.group == 'c'
        continue-on-error: true
        run: curl -fsSL https://cli.kiro.dev/install | bash
      # The Junie installer of the JetBrains/junie README. It puts the
      # shim in ~/.local/bin and the binary in ~/.local/share/junie.
      - name: Install Junie CLI
        if: matrix.group == 'c'
        continue-on-error: true
        run: curl -fsSL https://junie.jetbrains.com/install.sh | bash
      - name: Install Codebuff
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g codebuff
      - name: Install Qoder CLI
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @qoder-ai/qodercli
      - name: Install CodeBuddy Code
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @tencent-ai/codebuddy-code
      - name: Install Letta Code
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @letta-ai/letta-code
      - name: Install Neovate Code
        if: matrix.group == 'c'
        continue-on-error: true
        run: npm install -g @neovate/code
      - name: Install Every Code
        if: matrix.group == 'd'
        continue-on-error: true
        run: npm install -g @just-every/code
      - name: Install iFlow CLI
        if: matrix.group == 'd'
        continue-on-error: true
        run: npm install -g @iflow-ai/iflow-cli
      - name: Install Mistral Vibe
        if: matrix.group == 'd'
        continue-on-error: true
        run: uv tool install --python 3.12 mistral-vibe
      - name: Install gptme
        if: matrix.group == 'd'
        continue-on-error: true
        run: uv tool install --python 3.12 gptme
      # The installer of the Rust Open Interpreter (its README). It puts
      # interpreter in ~/.local/bin.
      - name: Install Open Interpreter
        if: matrix.group == 'd'
        continue-on-error: true
        run: curl -fsSL https://www.openinterpreter.com/install | sh
      # The installer of the superagent-ai/grok-cli README. It puts grok in
      # ~/.grok/bin.
      - name: Install Grok CLI
        if: matrix.group == 'd'
        continue-on-error: true
        run: curl -fsSL https://raw.githubusercontent.com/superagent-ai/grok-cli/main/install.sh | bash
      # The raw output of each run goes to a file, not to the public log.
      # The summary prints it through the scrub.
      - name: Run the scenarios
        env:
          AGENTS: ${{ matrix.agents }}
        run: |
          mkdir -p out
          for pair in $AGENTS; do
            a=${pair%%:*}
            c=${pair##*:}
            if sh scenarios/first-run.sh "$a" "$c" >"out/run-$a.txt" 2>&1; then
              echo "ran: $a"
            else
              echo "skipped or failed: $a"
            fi
          done
      - name: Summary (scrubbed)
        if: always()
        run: |
          for f in out/run-*.txt; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f" .txt)"
            sh tools/scrub.sh "$f" 2>/dev/null | grep -v '^output: ' | tail -n 3
          done
          for o in out/first-run-*; do
            [ -d "$o" ] || continue
            echo "################ $(basename "$o" | sed 's/-[0-9T]*Z$//')"
            sh tools/scrub.sh "$o/log.txt" 2>/dev/null
            echo "--- screen after 20 s"
            grep -v '^[[:space:]]*$' "$o/02-after-20s.screen" | sh tools/scrub.sh 2>/dev/null | head -n 30
            echo "--- processes"
            sh tools/scrub.sh "$o/02-after-20s.ps" 2>/dev/null
            echo "--- top folders made in the throwaway HOME"
            awk '{print $3}' "$o/02-after-20s.files" | sed 's#<sandbox>/home/##' | cut -d/ -f1-2 | sort | uniq -c | sort -rn | head -n 15
            # Also the folders of the folder variables (codex-home), which
            # start with <sandbox>/. next to the throwaway HOME.
            echo "--- open files below the throwaway HOME"
            grep -E '<sandbox>/(home|\.)' "$o/02-after-20s.open" | awk '{print $2}' | sed 's#<sandbox>/home/##' | sh tools/scrub.sh 2>/dev/null | sort -u | head -n 30
            echo "--- folders made in the throwaway HOME (files in each)"
            awk '{print $3}' "$o/02-after-20s.files" | sed 's#<sandbox>/home/##' | cut -d/ -f1-3 | sh tools/scrub.sh 2>/dev/null | sort | uniq -c | head -n 40
          done
      # The artifact holds only scrubbed copies: the screen after 20 s and
      # the log of each agent. The raw files stay on the runner, because
      # the artifacts of a public repository are public.
      - name: Scrub the screens for the artifact
        if: always()
        run: |
          mkdir -p scrubbed
          for o in out/first-run-*; do
            [ -d "$o" ] || continue
            d=scrubbed/$(basename "$o" | sed 's/-[0-9T]*Z$//')
            mkdir -p "$d"
            [ -f "$o/02-after-20s.screen" ] && sh tools/scrub.sh "$o/02-after-20s.screen" >"$d/02-after-20s.screen" 2>/dev/null
            [ -f "$o/log.txt" ] && sh tools/scrub.sh "$o/log.txt" >"$d/log.txt" 2>/dev/null
          done
          true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: first-run-${{ matrix.os }}-${{ matrix.group }}
          path: scrubbed/
          retention-days: 7
          if-no-files-found: warn

  windows-installs:
    name: Windows installs (${{ matrix.os }}, group ${{ matrix.group }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'windows-installs'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        group: [a, b, c, d]
        # Each entry is NAME=COMMAND[=NPM PACKAGE] for
        # scenarios/windows-installs.ps1.
        include:
          - group: a
            agents: >-
              claude=claude=@anthropic-ai/claude-code codex=codex=@openai/codex
              opencode=opencode=opencode-ai gemini=gemini=@google/gemini-cli
              copilot=copilot=@github/copilot qwen=qwen=@qwen-code/qwen-code
              cursor=agent cursor-agent=cursor-agent
          - group: b
            agents: >-
              amp=amp=@ampcode/cli crush=crush=@charmland/crush
              continue=cn=@continuedev/cli droid=droid=@factory/cli
              cline=cline=cline kilo=kilo=@kilocode/cli
              auggie=auggie=@augmentcode/auggie kimi=kimi
              opencode2=opencode2=@opencode/cli
          - group: c
            agents: >-
              kiro=kiro-cli junie=junie
              codebuff=codebuff=codebuff qoder=qodercli=@qoder-ai/qodercli
              codebuddy=codebuddy=@tencent-ai/codebuddy-code
              letta=letta=@letta-ai/letta-code neovate=neovate=@neovate/code
              everycode=coder=@just-every/code iflow=iflow=@iflow-ai/iflow-cli
          - group: d
            agents: >-
              aider=aider openhands=openhands gptme=gptme vibe=vibe
              goose=goose interpreter=interpreter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv installs the Python agents of group d.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # A failed install skips that agent.
      - name: Install the agents
        shell: pwsh
        run: ./scenarios/install-windows-agents.ps1 -Group ${{ matrix.group }}
      - name: Install report (scrubbed)
        shell: pwsh
        env:
          AGENTS: ${{ matrix.agents }}
        run: |
          $list = @($env:AGENTS -split '\s+' | Where-Object { $_ })
          ./scenarios/windows-installs.ps1 @list
      - name: Kit (scrubbed)
        if: always()
        shell: pwsh
        run: |
          ./probes/run.ps1 -All
          $f = Get-ChildItem agent-signals-probe-windows-*.txt | Select-Object -First 1
          Get-Content $f

  first-run-windows:
    name: First run Windows (${{ matrix.os }}, group ${{ matrix.group }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'first-run-windows'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        group: [a, b, c, d]
        # Each entry is NAME=COMMAND for scenarios/first-run-windows.ps1.
        # codex-home runs before codex, so that the real profile has no
        # .codex folder from the codex run yet.
        include:
          - group: a
            agents: >-
              claude=claude codex-home=codex codex=codex opencode=opencode
              gemini=gemini copilot=copilot qwen=qwen cursor=cursor-agent
          - group: b
            agents: >-
              amp=amp crush=crush continue=cn droid=droid cline=cline
              kilo=kilo auggie=auggie kimi=kimi opencode2=opencode2
          - group: c
            agents: >-
              kiro=kiro-cli junie=junie codebuff=codebuff qoder=qodercli
              codebuddy=codebuddy letta=letta neovate=neovate
              everycode=coder iflow=iflow
          - group: d
            agents: >-
              aider=aider openhands=openhands gptme=gptme vibe=vibe
              goose=goose interpreter=interpreter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv installs its own Python 3.12 for the CPU of the image, also on
      # arm64.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The driver packages, at exact versions.
      - name: Install the driver packages
        shell: pwsh
        run: |
          uv venv --managed-python --python 3.12 .venv-driver
          uv pip install --python .venv-driver pywinpty==3.1.2 pyte==0.8.2 wcwidth==0.9.4 psutil==7.2.2
      # A failed install skips that agent.
      - name: Install the agents
        shell: pwsh
        run: ./scenarios/install-windows-agents.ps1 -Group ${{ matrix.group }}
      # The raw output of each run goes to files in out\, not to the public
      # log. The next step prints it through the scrub.
      - name: Run the scenarios
        shell: pwsh
        env:
          AGENTS: ${{ matrix.agents }}
        run: |
          $list = @($env:AGENTS -split '\s+' | Where-Object { $_ })
          ./scenarios/first-run-windows.ps1 -Python .venv-driver\Scripts\python.exe @list
      - name: Summary (scrubbed)
        if: always()
        shell: pwsh
        run: ./scenarios/first-run-windows.ps1 -Summary

  kit-no-login:
    name: Kit no login (${{ matrix.os }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'kit-no-login'
    strategy:
      fail-fast: false
      matrix:
        # The Linux and macOS images of scenarios.yml.
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # uv gives the pty backend its Python packages.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install tmux
        run: |
          if command -v tmux >/dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux
          else
            sudo apt-get update -q && sudo apt-get install -y -q tmux
          fi
      - name: Add the user folders to PATH
        run: echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      # The agents of steps.tsv, with the install commands of
      # scenarios.yml. agy has the install command of
      # https://antigravity.google/docs/getting-started?tab=cli: it puts agy
      # in ~/.local/bin and takes no version. A failed install skips that
      # agent: the plan then has no step for it.
      - name: Install Claude Code
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code >"$RUNNER_TEMP/install-claude.txt" 2>&1
      - name: Install Codex CLI
        continue-on-error: true
        run: npm install -g @openai/codex >"$RUNNER_TEMP/install-codex.txt" 2>&1
      - name: Install Cursor CLI
        continue-on-error: true
        run: curl -fsS https://cursor.com/install | bash >"$RUNNER_TEMP/install-cursor.txt" 2>&1
      - name: Install agy
        continue-on-error: true
        run: curl -fsSL https://antigravity.google/cli/install.sh | bash >"$RUNNER_TEMP/install-agy.txt" 2>&1
      - name: Install output (scrubbed)
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/install-*.txt; do
            [ -f "$f" ] || continue
            echo "== $(basename "$f" .txt)"
            sh tools/scrub.sh "$f" 2>/dev/null | tail -n 5
          done
      # Each kit command writes to a file. The log gets the scrubbed file.
      - name: Run the kit
        run: |
          out=$RUNNER_TEMP/kit
          mkdir -m 700 "$out"
          raw=$(mktemp)
          k() {
            if sh probes/agent/kit.sh "$@" >"$raw" 2>&1; then rc=0; else rc=$?; fi
            sh tools/scrub.sh "$raw" 2>/dev/null
            return "$rc"
          }
          k start --home throwaway --out "$out"
          # Only a flag goes to GITHUB_ENV: the log shows its values. The
          # later commands find the run from .agent-signals-run.
          echo "KIT_RUN=1" >>"$GITHUB_ENV"
          k doctor
          k plan --home throwaway
          sed -n 's/^step: \(first-run-[^ ]*\) .*/\1/p' "$raw" >"$RUNNER_TEMP/steps.txt"
          echo "first-run steps in the plan: $(wc -l <"$RUNNER_TEMP/steps.txt" | tr -d ' ')"
          # Exit 3 is a skip: a needed tool is missing.
          : >"$RUNNER_TEMP/kit-failed.txt"
          while read -r s; do
            if k step "$s" || [ "$rc" -eq 3 ]; then :; else echo "$s: exit $rc" >>"$RUNNER_TEMP/kit-failed.txt"; fi
          done <"$RUNNER_TEMP/steps.txt"
          k session stop --all || true
      - name: Kit check
        id: check
        if: always() && env.KIT_RUN == '1'
        run: |
          raw=$(mktemp)
          if sh probes/agent/kit.sh check >"$raw" 2>&1; then rc=0; else rc=$?; fi
          sh tools/scrub.sh "$raw" 2>/dev/null
          a=$(sed -n 's/^archive: //p' "$raw")
          if [ -n "$a" ] && [ -f "$a" ]; then
            echo "--- the files in the archive"
            tar -tzf "$a"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outcome == 'success'
        with:
          name: kit-no-login-${{ matrix.os }}
          path: ${{ runner.temp }}/kit/agent-signals-run-*.tar.gz
          retention-days: 7
          if-no-files-found: warn
      # The login steps of Codex, Claude Code and agy with the fake model:
      # the real agent, no login, no model on the network, no cost. The run records the home mode "fixture".
      - name: Run the kit with the fake model
        id: fixture
        if: always() && env.KIT_RUN == '1'
        run: |
          out=$RUNNER_TEMP/kit-fixture
          mkdir -m 700 "$out"
          raw=$(mktemp)
          k() {
            if sh probes/agent/kit.sh "$@" >"$raw" 2>&1; then rc=0; else rc=$?; fi
            sh tools/scrub.sh "$raw" 2>/dev/null
            return "$rc"
          }
          k start --home fixture --out "$out"
          k plan --home fixture
          sed -n 's/^step: \([^ ]*\) needs=login [^ ]* measures=.*/\1/p' "$raw" >"$RUNNER_TEMP/fixture-steps.txt"
          echo "fixture steps in the plan: $(wc -l <"$RUNNER_TEMP/fixture-steps.txt" | tr -d ' ')"
          # A green job must not hide a plan with no step.
          if { command -v codex || command -v claude || command -v agy; } >/dev/null && [ ! -s "$RUNNER_TEMP/fixture-steps.txt" ]; then
            echo "no fixture step in the plan" >>"$RUNNER_TEMP/kit-failed.txt"
          fi
          while read -r s; do
            if k step "$s" || [ "$rc" -eq 3 ]; then :; else echo "$s: exit $rc" >>"$RUNNER_TEMP/kit-failed.txt"; fi
          done <"$RUNNER_TEMP/fixture-steps.txt"
          k session stop --all || true
          k check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fixture.outcome == 'success'
        with:
          name: kit-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/kit-fixture/agent-signals-run-*.tar.gz
          retention-days: 7
          if-no-files-found: warn
      - name: Fail on a failed step
        if: always()
        run: |
          f=$RUNNER_TEMP/kit-failed.txt
          [ -s "$f" ] || exit 0
          sh tools/scrub.sh "$f" 2>/dev/null
          exit 1

  kit-no-login-windows:
    name: Kit no login (${{ matrix.os }})
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'kit-no-login'
    strategy:
      fail-fast: false
      matrix:
        # The Windows images of scenarios.yml.
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The driver packages of the conpty backend, as in scenarios.yml.
      - name: Install the driver packages
        shell: pwsh
        run: |
          uv venv --managed-python --python 3.12 .venv-driver
          uv pip install --python .venv-driver pywinpty==3.1.2 pyte==0.8.2 wcwidth==0.9.4 psutil==7.2.2
      # Group a of scenarios.yml holds claude, codex and the Cursor CLI. The
      # script scrubs its output. A failed install skips that agent.
      - name: Install the agents
        shell: pwsh
        run: ./scenarios/install-windows-agents.ps1 -Group a
      # The agy install command of
      # https://antigravity.google/docs/getting-started?tab=cli. It puts agy
      # in %LOCALAPPDATA%\agy\bin and takes no version.
      - name: Install agy
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'install-agy.txt'
          & { irm https://antigravity.google/cli/install.ps1 | iex } *> $log
          Join-Path $env:LOCALAPPDATA 'agy\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & pwsh -NoProfile -File tools/scrub.ps1 -Path $log 2>$null | Select-Object -Last 5
      - name: Run the kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # A private folder in the profile: kit start refuses a folder
          # that other accounts can write to.
          $out = Join-Path $env:RUNNER_TEMP 'kit'
          New-Item -ItemType Directory -Path $out | Out-Null
          # On windows-11-arm a new folder in RUNNER_TEMP gets explicit
          # entries for Authenticated Users (S-1-5-11) and Users
          # (S-1-5-32-545). "/inheritance:r" does not remove them.
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls $out /inheritance:r /grant:r "*${sid}:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" | Out-Null
          & icacls $out /remove:g "*S-1-5-11" "*S-1-5-32-545" | Out-Null
          $raw = Join-Path $env:RUNNER_TEMP 'kit-raw.txt'
          $py = (Resolve-Path '.venv-driver\Scripts\python.exe').ProviderPath
          function K {
            & pwsh -NoProfile -File probes/agent/kit.ps1 @args *> $raw
            $script:rc = $LASTEXITCODE
            & pwsh -NoProfile -File tools/scrub.ps1 -Path $raw 2>$null
          }
          K start --home throwaway --out $out --python $py
          if ($script:rc -ne 0) { Write-Output "kit start: exit $($script:rc)"; exit 1 }
          # Only a flag goes to GITHUB_ENV: the log shows its values.
          $env:AGENT_SIGNALS_RUN = (Get-Content (Join-Path $out '.agent-signals-run') | Select-Object -First 1)
          if ($env:AGENT_SIGNALS_RUN) { 'KIT_RUN=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          K doctor --python $py
          K plan --home throwaway --python $py
          $steps = @(Get-Content $raw | ForEach-Object { if ($_ -match '^step: (first-run-\S+) ') { $Matches[1] } })
          Write-Output "first-run steps in the plan: $($steps.Count)"
          # Exit 3 is a skip: a needed tool is missing.
          foreach ($s in $steps) {
            K step $s
            if ($script:rc -ne 0 -and $script:rc -ne 3) {
              "${s}: exit $($script:rc)" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'kit-failed.txt') -Append -Encoding utf8
            }
          }
          K session stop --all
          exit 0
      - name: Kit check
        id: check
        if: always() && env.KIT_RUN == '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $raw = Join-Path $env:RUNNER_TEMP 'kit-raw.txt'
          $env:AGENT_SIGNALS_RUN = (Get-Content (Join-Path $env:RUNNER_TEMP 'kit\.agent-signals-run') | Select-Object -First 1)
          & pwsh -NoProfile -File probes/agent/kit.ps1 check *> $raw
          $rc = $LASTEXITCODE
          & pwsh -NoProfile -File tools/scrub.ps1 -Path $raw 2>$null
          $a = (Get-Content $raw | Where-Object { $_ -like 'archive: *' } | Select-Object -First 1)
          if ($a) {
            $a = $a.Substring(9)
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $z = [IO.Compression.ZipFile]::OpenRead($a)
            Write-Output '--- the files in the archive'
            $z.Entries | ForEach-Object { $_.FullName }
            $z.Dispose()
          }
          exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outcome == 'success'
        with:
          name: kit-no-login-${{ matrix.os }}
          path: ${{ runner.temp }}/kit/agent-signals-run-*.zip
          retention-days: 7
          if-no-files-found: warn
      # The login steps of Codex with the fake model, as on Linux and macOS.
      - name: Run the kit with the fake model
        id: fixture
        if: always() && env.KIT_RUN == '1'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'kit-fixture'
          New-Item -ItemType Directory -Path $out | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls $out /inheritance:r /grant:r "*${sid}:(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" | Out-Null
          & icacls $out /remove:g "*S-1-5-11" "*S-1-5-32-545" | Out-Null
          $raw = Join-Path $env:RUNNER_TEMP 'kit-fixture-raw.txt'
          $py = (Resolve-Path '.venv-driver\Scripts\python.exe').ProviderPath
          function K {
            & pwsh -NoProfile -File probes/agent/kit.ps1 @args *> $raw
            $script:rc = $LASTEXITCODE
            & pwsh -NoProfile -File tools/scrub.ps1 -Path $raw 2>$null
          }
          K start --home fixture --out $out --python $py
          $env:AGENT_SIGNALS_RUN = (Get-Content (Join-Path $out '.agent-signals-run') | Select-Object -First 1)
          K plan --home fixture --python $py
          $steps = @(Get-Content $raw | ForEach-Object { if ($_ -match '^step: (\S+) needs=login ' -and $_ -notmatch ' skip=') { $Matches[1] } })
          Write-Output "fixture steps in the plan: $($steps.Count)"
          # A green job must not hide a plan with no step.
          if ($steps.Count -eq 0 -and (Get-Command codex -ErrorAction SilentlyContinue)) {
            'no fixture step in the plan' | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'kit-failed.txt') -Append -Encoding utf8
          }
          foreach ($s in $steps) {
            K step $s
            if ($script:rc -ne 0 -and $script:rc -ne 3) {
              "${s}: exit $($script:rc)" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'kit-failed.txt') -Append -Encoding utf8
            }
          }
          K session stop --all
          K check
          exit $script:rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fixture.outcome == 'success'
        with:
          name: kit-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/kit-fixture/agent-signals-run-*.zip
          retention-days: 7
          if-no-files-found: warn
      - name: Fail on a failed step
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'kit-failed.txt'
          if (-not (Test-Path -LiteralPath $f)) { exit 0 }
          & pwsh -NoProfile -File tools/scrub.ps1 -Path $f 2>$null
          exit 1

  kit-login:
    name: Kit login (${{ matrix.os }})
    # Only the main branch, on a schedule or by hand: a pull request or
    # another branch never gets a key.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job == 'kit-login'))
    # One group for each job: a second run waits, so that it adds no turns
    # at the same time. A group holds one waiting job, so the jobs do not
    # share a group.
    concurrency:
      group: kit-login-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # kit-login-windows is the Windows runner.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This step gets only "true" or "false", not a key.
      - name: Find the agents with a key
        env:
          HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_CODEX: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_CURSOR: ${{ secrets.CURSOR_API_KEY != '' }}
        run: |
          n=0
          for p in "claude $HAS_CLAUDE" "codex $HAS_CODEX" "cursor $HAS_CURSOR"; do
            a=${p% *}
            if [ "${p#* }" = true ]; then
              echo "KIT_KEY_$(echo "$a" | tr '[:lower:]' '[:upper:]')=1" >>"$GITHUB_ENV"
              n=$((n + 1))
            else
              echo "skip: no secret ($a)"
            fi
          done
          if [ "$n" -gt 0 ]; then
            echo "KIT_LOGIN=1" >>"$GITHUB_ENV"
          else
            echo "skip: no secret"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.KIT_LOGIN == '1'
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.KIT_LOGIN == '1'
        with:
          enable-cache: false
      - name: Install tmux and the agents with a key
        if: env.KIT_LOGIN == '1'
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install tmux >/dev/null
            else
              sudo apt-get update -q >/dev/null && sudo apt-get install -y -q tmux >/dev/null
            fi
          fi
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          [ "${KIT_KEY_CLAUDE:-}" != 1 ] || sh scenarios/kit-login.sh install claude
          [ "${KIT_KEY_CODEX:-}" != 1 ] || sh scenarios/kit-login.sh install codex
          [ "${KIT_KEY_CURSOR:-}" != 1 ] || sh scenarios/kit-login.sh install cursor
      - name: Start the kit
        if: env.KIT_LOGIN == '1'
        run: |
          out=$RUNNER_TEMP/kit
          mkdir -m 700 "$out"
          raw=$(mktemp)
          k() {
            if sh probes/agent/kit.sh "$@" >"$raw" 2>&1; then rc=0; else rc=$?; fi
            sh tools/scrub.sh "$raw" 2>/dev/null
            return "$rc"
          }
          k start --home real --out "$out"
          # Only a flag goes to GITHUB_ENV: the log shows its values.
          echo "KIT_RUN=1" >>"$GITHUB_ENV"
          k doctor
          k plan --home real
      # Each step gets only the key of its agent. The script deletes it.
      - name: Claude Code permission step
        if: env.KIT_KEY_CLAUDE == '1' && env.KIT_RUN == '1'
        env:
          KIT_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: sh scenarios/kit-login.sh run claude
      - name: Codex CLI permission step
        if: env.KIT_KEY_CODEX == '1' && env.KIT_RUN == '1'
        env:
          KIT_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: sh scenarios/kit-login.sh run codex
      - name: Cursor CLI permission step
        if: env.KIT_KEY_CURSOR == '1' && env.KIT_RUN == '1'
        env:
          KIT_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: sh scenarios/kit-login.sh run cursor
      # The keys are in the environment of this step, so that the check
      # searches the run files for them. This step starts no agent.
      - name: Kit check
        id: check
        if: always() && env.KIT_RUN == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          raw=$(mktemp)
          if sh probes/agent/kit.sh check >"$raw" 2>&1; then rc=0; else rc=$?; fi
          sh tools/scrub.sh "$raw" 2>/dev/null
          a=$(sed -n 's/^archive: //p' "$raw")
          if [ -n "$a" ] && [ -f "$a" ]; then
            echo "--- the files in the archive"
            tar -tzf "$a"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outcome == 'success' && inputs.upload_login
        with:
          name: kit-login-${{ matrix.os }}
          path: ${{ runner.temp }}/kit/agent-signals-run-*.tar.gz
          retention-days: 7
          if-no-files-found: warn
      - name: Fail on a failed step
        if: always() && env.KIT_LOGIN == '1'
        run: |
          f=$RUNNER_TEMP/kit-failed.txt
          [ -s "$f" ] || exit 0
          sh tools/scrub.sh "$f" 2>/dev/null
          exit 1

  kit-login-windows:
    name: Kit login (windows-2025)
    # Only the main branch, on a schedule or by hand: a pull request or
    # another branch never gets a key.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job == 'kit-login'))
    concurrency:
      group: kit-login-windows-2025
      cancel-in-progress: false
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # This step gets only "true" or "false", not a key.
      - name: Find the agents with a key
        shell: pwsh
        env:
          HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_CODEX: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_CURSOR: ${{ secrets.CURSOR_API_KEY != '' }}
        run: |
          $n = 0
          foreach ($a in 'claude', 'codex', 'cursor') {
