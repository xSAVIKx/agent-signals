  input region. A reader that tests the frame alone gives IDLE, and an Enter
  then confirms the selected option. tg-bridge measured it in a live pane. The
  size of the pane was not recorded.
  `tests/test_sessions.py::test_a_dialog_above_a_framed_box_is_not_idle`
  asserts the state.
  `tests/test_sessions.py::test_the_options_of_an_overlay_are_read_from_the_block`
  asserts the options, read from the block of the dialog and not from the
  input region.
  `tests/test_sessions.py::test_the_overlay_summary_gives_the_question_and_every_option`
  asserts that the summary holds the question.
